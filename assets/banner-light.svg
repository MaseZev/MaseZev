<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none" role="img" aria-label="MaseZev — bots, backend, frontend, content">
  <title>MaseZev</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F7F5FF"/>
      <stop offset="1" stop-color="#FFF1F7"/>
    </linearGradient>
    <linearGradient id="name" x1="88" y1="120" x2="600" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F19"/>
      <stop offset="0.55" stop-color="#3B0764"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="rule" x1="88" y1="0" x2="470" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.65" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(1120 20) rotate(115) scale(380 460)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(220 330) rotate(-40) scale(360 320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EC4899" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#0B0F19" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="340" rx="24"/>
    </clipPath>
    <style>
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.25 } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#dots)"/>
    <rect width="1280" height="340" fill="url(#glowA)"/>
    <rect width="1280" height="340" fill="url(#glowB)"/>

    <rect x="88" y="96" width="64" height="6" rx="3" fill="url(#rule)"/>

    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" x="88" y="198" font-size="84" font-weight="800" letter-spacing="-2.5" fill="url(#name)">MaseZev</text>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="90" y="242" font-size="17" letter-spacing="3.4" fill="#64748B">BOTS · BACKEND · FRONTEND · CONTENT</text>

    <g>
      <rect x="742" y="54" width="448" height="232" rx="18" fill="#FFFFFF"/>
      <rect x="742.5" y="54.5" width="447" height="231" rx="17.5" stroke="#C4B5FD"/>
      <path d="M742 96h448" stroke="#DDD6FE"/>
      <circle cx="770" cy="75" r="5.5" fill="#FF5F57"/>
      <circle cx="790" cy="75" r="5.5" fill="#FEBC2E"/>
      <circle cx="810" cy="75" r="5.5" fill="#28C840"/>
      <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="1180" y="80" text-anchor="end" font-size="12" letter-spacing="2" fill="#94A3B8">profile.sh</text>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
        <text x="770" y="132" fill="#7C3AED">$ whoami</text>
        <text x="770" y="158" fill="#1F2937">Никита · 18 · developer</text>
        <text x="770" y="190" fill="#7C3AED">$ stack --list</text>
        <text x="770" y="216" fill="#1F2937">python · c# · js · ts · sql</text>
        <text x="770" y="248" fill="#7C3AED">$ status</text>
        <circle class="pulse" cx="776" cy="269" r="4.5" fill="#059669"/>
        <text x="792" y="274" fill="#059669">open to collaboration</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="23.5" stroke="#C4B5FD"/>
</svg>
